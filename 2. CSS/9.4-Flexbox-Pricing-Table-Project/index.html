<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      .pricing-container {
        display: flex; /* aligns everything horizontally on one line */
        justify-content: center; /* centers it */
        align-items: center;
        height: 100vh; /* adds a height of 100 */
        gap: 2rem; /* adds 2rem of spaces between each container */
      }

      .pricing-plan {
        flex: 1; /* allows grow and shrink of flex items to fill spaces in a layout */
        max-width: 400px; /* for responsiveness */
        padding: 20px; /* padding/space around pricing plan */
        background-color: #f2f2f2; /* visible light grey background */
        border-radius: 8px; /* slightly rounded corners */
        text-align: center; /* aligns texts inside to center */
      }

      .plan-title {
        font-size: 24px; /* Resizes the plan title */
        font-weight: bold; /* makes it bold */
        margin-top: 10px; /* adds a margin/space above(outside) the title */
      }

      .plan-price {
        font-size: 48px; /* resizes the plan price */
        font-weight: bold; /* makes it bold */
        margin-bottom: 10px; /* adds margin/space below(outside) the price */
      }

      .plan-features {
        list-style: none; /* remves the bullets of lists */
        padding: 0; /* removes padding(check box model) */
        margin: 0; /* removes margin(check box model) */
      }

      .plan-features li {
        /* Specificity - descendant, targets all list */
        margin-bottom: 20px; /* gives each item on list a margin bottom of 20px */
      }

      .plan-button {
        padding: 10px; /* adds a padding/space(inside) the button */
        background-color: #ff6600; /* background of red-orange */
        color: #fff; /* text color of white */
        border-radius: 5px; /* rounded corners */
        border: none; /* removes visible border */
      }

      /* added this fun pseudo-code for visual effects */
      .plan-button:hover {
        cursor: pointer;
        background-color: #b34800;
        color: #e0e0e0;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column; /* sets the direction of flex items/responsiveness to column */
          height: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
